<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>双人五子棋</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f2ec;color:#302d27;font:15px system-ui,'Microsoft Yahei',sans-serif}.wrap{max-width:920px;margin:35px auto;padding:20px}h1{margin:0;font-size:34px}.muted{color:#817c72}.card{background:#fffefa;border:1px solid #e6e1d7;border-radius:16px;padding:22px;margin:18px 0;box-shadow:0 8px 25px #382d1510}input,button,select{padding:10px 13px;border:1px solid #ddd7cb;border-radius:9px;background:white;font:inherit}button{cursor:pointer}button:disabled{opacity:.48;cursor:not-allowed}.primary{background:#34382f;color:white}.danger{color:#a54137}.row{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none}.top{display:flex;justify-content:space-between;align-items:center}.layout{display:grid;grid-template-columns:minmax(300px,620px) 240px;gap:16px}.board{display:grid;grid-template-columns:repeat(15,1fr);aspect-ratio:1;background:#d9b36f;padding:12px;border:1px solid #c69b53}.cell{padding:0;border:0;border-radius:0;background:transparent;position:relative;display:grid;place-items:center;min-width:0}.cell:before,.cell:after{content:'';position:absolute;background:#75552f99}.cell:before{height:1px;left:0;right:0;top:50%}.cell:after{width:1px;top:0;bottom:0;left:50%}.cell:nth-child(15n+1):before{left:50%}.cell:nth-child(15n):before{right:50%}.cell:nth-child(-n+15):after{top:50%}.cell:nth-last-child(-n+15):after{bottom:50%}.stone{z-index:1;width:78%;height:78%;border-radius:50%;box-shadow:1px 2px 4px #0005}.cell.last .stone{outline:3px solid #df543e;outline-offset:2px}.lastmove{margin:10px 2px 0;font-size:13px;font-weight:600;color:#a84737;min-height:20px}.black{background:radial-gradient(circle at 30% 25%,#666,#151515 70%)}.white{background:radial-gradient(circle at 30% 25%,white,#d5d3ce 75%);border:1px solid #aaa}.active{outline:1px solid #b3935d;background:#f7f1e4}.player{padding:12px;background:#f6f4ee;margin:8px 0;border-radius:9px}.hint{color:#806b4a;min-height:22px}.players-note{font-size:13px;line-height:1.65;color:#817c72}.game-notice{margin:0 0 14px;padding:12px 14px;border-radius:10px;background:#e8f3e8;color:#285d32;font-weight:700;text-align:center;border:1px solid #c5dfc7}.game-notice.draw{background:#f4f0df;color:#695620;border-color:#e7dcae}.game-notice.left{background:#f7eae6;color:#8a3f32;border-color:#edc8bc}dialog{border:0;border-radius:14px;padding:24px;box-shadow:0 12px 60px #0004}dialog::backdrop{background:#2228}@media(max-width:700px){.layout{grid-template-columns:1fr}.wrap{margin:12px auto;padding:12px}}
</style></head><body><div class="wrap"><div class="top"><div><p class="muted">HOME GOMOKU</p><h1>五子棋</h1><p class="muted">每局掷骰决定黑棋，黑棋先手</p></div><span id="conn">连接中…</span></div>
<section id="lobby" class="card"><h2>创建或加入棋局</h2><p class="muted">房主不享有先手特权；每局由双方掷骰决定黑棋。</p><div class="row"><input id="name" placeholder="请输入你的名字" maxlength="20"><button id="create" class="primary">创建房间</button><input id="codeIn" placeholder="房间码" maxlength="5"><button id="join">加入</button></div><p id="err" class="danger"></p></section>
<section id="game" class="layout hidden"><div class="card"><div class="top"><div>房间 <b id="code"></b> <button id="copy">复制邀请链接</button><h2 id="status"></h2></div><span id="turn"></span></div><div id="gameNotice" class="game-notice hidden" role="status" aria-live="polite"></div><div id="board" class="board"></div><p id="lastMove" class="lastmove">尚无落子</p><div class="row" style="margin-top:15px"><select id="botDifficulty" aria-label="机器人难度"><option value="easy">简单机器人</option><option value="medium" selected>中等机器人</option><option value="master">大师机器人</option></select><button id="botJoin">邀请机器人</button><button id="roll" class="primary">掷骰子</button><button id="undo">请求悔棋</button><button id="restart">重新开局</button><button id="resign" class="danger">认输</button><button id="leave">退出房间</button></div><p id="hint" class="hint"></p></div><aside class="card"><h3>本局掷骰</h3><div id="p1" class="player">玩家 1：等待加入</div><div id="p2" class="player">玩家 2：等待加入</div><p class="players-note">两人各掷一次 1–6 点，点数较大者执黑并先手；平局则双方重掷。重新开局需对方同意。</p></aside></section></div>
<dialog id="dlg"><h3 id="dt"></h3><p id="db"></p><div class="row"><button id="no">拒绝</button><button id="yes" class="primary">同意</button></div></dialog><script src="/socket.io/socket.io.js"></script><script src="/client.js?v=16"></script></body></html>
