<section id="lobby" class="card"><h2>创建或加入棋局</h2><p class="muted">房主不享有先手特权；每局由双方掷骰决定先手方。</p><div class="row"><input id="name" placeholder="请输入你的名字" maxlength="20"><select id="gameType" aria-label="选择棋类"><option value="gomoku">五子棋</option><option value="xiangqi">中国象棋</option><option value="chess">国际象棋</option><option value="go">围棋</option><option value="checkers">跳棋（英式）</option><option value="chinese-checkers">中国跳棋</option></select><button id="create" class="primary">创建房间</button><input id="codeIn" placeholder="房间码" maxlength="5"><button id="join">加入</button></div><p id="err" class="danger"></p></section>
<section id="game" class="layout hidden"><div class="card"><div class="top"><div>房间 <b id="code"></b> <button id="copy">复制邀请链接</button><h2 id="status"></h2></div><span id="turn"></span></div><div id="gameNotice" class="game-notice hidden" role="status" aria-live="polite"></div><div id="board" class="board"></div><p id="lastMove" class="lastmove">尚无落子</p><div class="row" style="margin-top:15px"><select id="botDifficulty" aria-label="机器人难度"><option value="easy">简单机器人</option><option value="medium" selected>中等机器人</option><option value="master">大师机器人</option></select><button id="botJoin">邀请机器人</button><button id="roll" class="primary">掷骰子</button><button id="pass">停一手</button><button id="endTurn" class="hidden">结束跳跃</button><button id="undo">请求悔棋</button><button id="restart">重新开局</button><button id="resign" class="danger">认输</button><button id="leave">退出房间</button></div><p id="hint" class="hint"></p></div><aside class="card"><h3>本局掷骰</h3><div id="p1" class="player">玩家 1：等待加入</div><div id="p2" class="player">玩家 2：等待加入</div><p class="players-note">点数较大者执先手方；平局则双方重掷。重新开局需对方同意。</p></aside></section></div>
<dialog id="feedbackDialog"><h2>反馈建议</h2><p class="muted">告诉我你遇到的问题或想要的功能。你的邮箱不会公开。</p><div class="feedback-form"><label>反馈类型<select id="feedbackCategory"><option value="idea">功能建议</option><option value="bug">问题反馈</option><option value="other">其他</option></select></label><label>你的建议<textarea id="feedbackMessage" maxlength="2000" placeholder="请写下你的想法…"></textarea></label><label>联系邮箱（选填）<input id="feedbackContact" type="email" maxlength="254" placeholder="仅在你希望我回复时填写"></label><input id="feedbackWebsite" class="trap" tabindex="-1" autocomplete="off" aria-hidden="true"><p id="feedbackStatus" class="feedback-status" role="status"></p><div class="row"><button id="feedbackClose" type="button">关闭</button><button id="feedbackSend" type="button" class="primary">发送反馈</button></div></div></dialog>
<dialog id="dlg"><h3 id="dt"></h3><p id="db"></p><div class="row"><button id="no">拒绝</button><button id="yes" class="primary">同意</button></div></dialog><script src="/socket.io/socket.io.js"></script><script src="/client.js?v=35"></script></body></html>
